<!-- src/app/home/home.component.html -->
<div class="container-fluid">
  <!-- شريط التصفية العلوي -->
  <div class="filters-bar d-flex justify-content-between align-items-center py-3">
    <div class="filters d-flex gap-3 overflow-auto">
      <button *ngFor="let filter of filters" class="btn btn-outline-secondary filter-btn" (click)="selectFilter(filter.name)">
        <i class="{{filter.icon}} me-1"></i> {{filter.name}}
      </button>
    </div>
    <div class="d-flex align-items-center gap-2">
      <button class="btn btn-outline-secondary">Filters <i class="fas fa-sliders-h ms-1"></i></button>
      <button class="btn btn-outline-secondary">Prices include all fees <i class="fas fa-chevron-down ms-1"></i></button>
    </div>
  </div>

  <!-- قائمة الإقامات -->
  <div class="row">
    <div class="col-12 col-md-6 col-lg-3 mb-4" *ngFor="let accommodation of accommodations">
      <a [routerLink]="accommodation.id === 1 ? ['/accommodation', accommodation.id] : null" style="text-decoration: none; color: inherit;">
        <div class="card h-100">
          <div class="position-relative">
            <img [src]="accommodation.image" class="card-img-top" alt="Accommodation">
            <button class="favorite-btn">
              <i class="far fa-heart"></i>
            </button>
            <span class="badge guest-favorite" *ngIf="accommodation.isGuestFavorite">
              <i class="fas fa-trophy me-1"></i> Guest favorite
            </span>
          </div>
          <div class="card-body">
            <div class="d-flex justify-content-between align-items-center">
              <h5 class="card-title mb-0">{{accommodation.location}}</h5>
              <div class="d-flex align-items-center">
                <i class="fas fa-star text-warning me-1"></i>
                <span>{{accommodation.rating}}</span>
              </div>
            </div>
            <p class="card-text text-muted">{{accommodation.distance}}</p>
            <p class="card-text text-muted">{{accommodation.dates}}</p>
            <p class="card-text">
              <strong>{{accommodation.price}} E£</strong> for 5 nights
            </p>
          </div>
        </div>
      </a>
    </div>
  </div>

  <!-- Continue exploring section -->
  <div class="text-center my-4">
    <p class="continue-exploring-text">Continue exploring {{selectedFilter.toLowerCase()}}</p>
    <button class="btn btn-dark show-more-btn" (click)="showMore()">
      Show more
    </button>
  </div>
</div>
